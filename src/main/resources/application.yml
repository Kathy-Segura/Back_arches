spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db_sistema_arches
    username: admin
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: clinica

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /docs
